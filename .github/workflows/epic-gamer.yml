name: Epic Awesome Gamer (Scheduled)

on:
  workflow_dispatch: # 手动触发
  schedule:
    # 每周四 UTC 15:20 运行一次（北京时间周四 23:20）
    # 该时间点放在 Epic 周免刷新之后，避免过早触发。
    - cron: '20 15 * * 4'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  epic-gamer:
    runs-on: ubuntu-latest
    # A single account run can take 15-20 minutes. Multi-account runs are
    # sequential, so scale the timeout with the number of accounts by setting
    # a repository variable JOB_TIMEOUT_MINUTES (Settings -> Secrets and
    # variables -> Actions -> Variables). Defaults to 60 minutes.
    timeout-minutes: ${{ fromJSON(vars.JOB_TIMEOUT_MINUTES || '60') }}

    # 默认不在主仓库自身执行定时任务；Fork 后的仓库会正常运行。
    if: github.repository != 'Ronchy2000/epic-freebies-helper'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxml2-dev libxslt-dev

      - name: Install dependencies
        run: uv sync

      - name: Validate hCaptcha protocol contract
        env:
          PYTHONPATH: app
        run: uv run python scripts/check_hcaptcha_contract.py

      # 增加 GITHUB_TOKEN 以降低 Camoufox 下载时的 403 频率限制。
      # 即使这里失败，运行时也可以回退到 Playwright Firefox。
      - name: Install Camoufox
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run camoufox fetch

      # 记录实际安装的浏览器构建版本。Camoufox 0.5+ 会安装 Python 包自带的
      # browser-pin，这一步用来确认装到的确实是配套构建，而不是别的版本。
      - name: Report Camoufox build
        if: always()
        continue-on-error: true
        env:
          NO_COLOR: "1"
        run: |
          {
            echo "## Camoufox build"
            echo '```'
            uv run camoufox version 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright Firefox fallback
        run: uv run playwright install firefox

      # secrets 上下文不允许出现在 steps[*].if 里（GitHub 只放行 env/github/inputs/job/
      # matrix/needs/runner/steps/strategy/vars），直接写 secrets.X != '' 会让整个工作流
      # 判定为无效并立刻 startup_failure。所以先由一个步骤把「配没配」落成标志位，
      # 后面的步骤再用 env 上下文判断。
      - name: Detect proxy configuration
        env:
          DIRECT_PROXY: ${{ secrets.BROWSER_PROXY }}
          SUBSCRIPTION: ${{ secrets.PROXY_SUBSCRIPTION }}
        run: |
          if [ -n "$DIRECT_PROXY" ]; then
            echo "HAS_DIRECT_PROXY=1" >> "$GITHUB_ENV"
            echo "BROWSER_PROXY: 已配置"
          else
            echo "BROWSER_PROXY: 未配置"
          fi
          if [ -n "$SUBSCRIPTION" ]; then
            echo "HAS_SUBSCRIPTION=1" >> "$GITHUB_ENV"
            echo "PROXY_SUBSCRIPTION: 已配置"
          else
            echo "PROXY_SUBSCRIPTION: 未配置"
          fi

      # 可选：直接配置了一条具体代理地址（http/socks5）时原样透传给浏览器。
      # 只把非空值写进 GITHUB_ENV，避免空字符串被 pydantic 解析成非 None。
      - name: Resolve browser proxy
        if: env.HAS_DIRECT_PROXY == '1'
        env:
          DIRECT_PROXY: ${{ secrets.BROWSER_PROXY }}
        run: echo "BROWSER_PROXY=$DIRECT_PROXY" >> "$GITHUB_ENV"

      # 可选：配置了 PROXY_SUBSCRIPTION（Clash 订阅链接）时，在 runner 本地起一个
      # mihomo(clash.meta) 把订阅转成本地 http/socks5 混合端口。订阅里的
      # vmess/vless/trojan/hysteria2 等私有协议浏览器无法直连，必须经过这一层转换。
      #
      # 关键点：不是"连上就算成功"。桥只写 BROWSER_PROXY 到 GITHUB_ENV 的前提是
      # 出口 IP 与直连不同；并且会逐个节点实测出口 ASN，优先挑住宅/家宽出口。
      # 机场默认的"最低延迟"节点在 Actions 上几乎总是落到 AS8075/Azure 这类机房
      # 网段，对 hCaptcha 与 Epic 的风控毫无帮助。逻辑都在下面的脚本里，便于本地自测：
      #   python3 .github/scripts/proxy_bridge.py --self-test
      - name: Set up local proxy bridge
        if: env.HAS_SUBSCRIPTION == '1' && env.HAS_DIRECT_PROXY != '1'
        continue-on-error: true
        env:
          SUBSCRIPTION: ${{ secrets.PROXY_SUBSCRIPTION }}
          NODE_FILTER: ${{ vars.PROXY_NODE_FILTER || '' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/proxy_bridge.py

      # 把出口 IP 和归属组织打进 job summary：一眼判断订阅节点是不是住宅/家宽出口。
      # org 是 Alibaba/Tencent/Hetzner/OVH 这类机房，对 hCaptcha 风控基本没有帮助。
      # tee 让同样的内容也落在作业日志里，否则 summary 只能从网页看、grep 不到。
      # 这里同时把代理桥自己的结论（有没有写 BROWSER_PROXY、选了哪个节点）复述一遍，
      # 便于在作业级别直接确认，而不用回去翻上一个步骤的日志。
      - name: Report egress IP
        if: always()
        continue-on-error: true
        env:
          NO_COLOR: "1"
        run: |
          {
            echo "## Egress IP"
            if [ -n "${BROWSER_PROXY:-}" ]; then
              echo
              echo "代理桥已生效：\`BROWSER_PROXY=$BROWSER_PROXY\`（选中节点 \`${PROXY_PICKED_NODE:-未知}\`）"
            else
              echo
              echo "本次运行**未使用代理**（未配置，或代理桥自检未通过）。"
            fi
            echo '```'
            echo "--- direct (GitHub runner) ---"
            curl -s --max-time 10 https://ipinfo.io/json | python3 -m json.tool 2>/dev/null \
              || echo "(lookup failed)"
            echo
            echo "--- via local bridge 127.0.0.1:7890 ---"
            curl -s --max-time 15 -x http://127.0.0.1:7890 https://ipinfo.io/json | python3 -m json.tool 2>/dev/null \
              || echo "(bridge not ready or lookup failed)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run Epic Awesome Gamer
        env:
          EPIC_EMAIL: ${{ secrets.EPIC_EMAIL }}
          EPIC_PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          EPIC_ACCOUNTS: ${{ secrets.EPIC_ACCOUNTS }}
          EPIC_TOTP_SECRET: ${{ secrets.EPIC_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WXPUSH_ENDPOINT: ${{ secrets.WXPUSH_ENDPOINT }}
          WXPUSH_TOKEN: ${{ secrets.WXPUSH_TOKEN }}
          WXPUSH_USERID: ${{ secrets.WXPUSH_USERID }}
          WXPUSH_TEMPLATE_ID: ${{ secrets.WXPUSH_TEMPLATE_ID }}
          WXPUSH_BASE_URL: ${{ secrets.WXPUSH_BASE_URL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODEL: ${{ vars.GLM_MODEL || secrets.GLM_MODEL }}
          CHALLENGE_CLASSIFIER_MODEL: ${{ vars.CHALLENGE_CLASSIFIER_MODEL || secrets.CHALLENGE_CLASSIFIER_MODEL }}
          IMAGE_CLASSIFIER_MODEL: ${{ vars.IMAGE_CLASSIFIER_MODEL || secrets.IMAGE_CLASSIFIER_MODEL }}
          SPATIAL_POINT_REASONER_MODEL: ${{ vars.SPATIAL_POINT_REASONER_MODEL || secrets.SPATIAL_POINT_REASONER_MODEL }}
          SPATIAL_PATH_REASONER_MODEL: ${{ vars.SPATIAL_PATH_REASONER_MODEL || secrets.SPATIAL_PATH_REASONER_MODEL }}
          BROWSER_BACKEND: auto
          # BROWSER_PROXY 由前面的 "Resolve browser proxy" / "Set up local proxy bridge"
          # 两步按优先级写入 GITHUB_ENV：显式 secret 优先，其次订阅桥，都没配则不设。
          HEADLESS: virtual
          DISABLE_BEZIER_TRAJECTORY: false
          # 在 Actions 中我们依靠 GitHub 的 cron 触发，所以关闭内部调度器
          ENABLE_APSCHEDULER: false
          MPLBACKEND: Agg
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: app
          # 让 Python 侧的 LLM 调用（hCaptcha 分类器用的 GLM）也走住宅代理出口。
          # 直连 Azure 云 IP 时 GLM 端点 50s ReadTimeout（被 geo-block 静默丢弃），
          # 住宅出口可绕过；浏览器侧仍用显式 BROWSER_PROXY，不会双重代理。
          HTTP_PROXY: ${{ secrets.BROWSER_PROXY }}
          HTTPS_PROXY: ${{ secrets.BROWSER_PROXY }}
          GLM_REQUEST_TIMEOUT_SECONDS: "120"
        run: |
          echo "🚀 启动定时领取任务（支持 Gemini/AiHubMix/GLM）..."
          xvfb-run --auto-servernum --server-num=1 --server-args='-screen 0, 1920x1080x24' uv run app/deploy.py

      - name: Write success summary
        if: success()
        run: |
          if grep -Rqs -E \
            'unable to download any more free games|wait 24 hours before trying again|24-hour free-game limit detected' \
            app/volumes/logs/ app/volumes/runtime/ 2>/dev/null; then
            {
              echo "## Run stopped: Epic 24-hour limit"
              echo
              echo "Action 已正常结束，但本次领取未成功：Epic 已限制该账号继续领取免费游戏。"
              echo
              echo "No successful claim was confirmed for the affected account. Wait at least 24 hours before running the workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Run completed"
              echo
              echo "The workflow completed successfully."
              echo
              echo "- Share successful runs here: [Share your successful runs here / 成功领取的来这里留言！ #3](https://github.com/Ronchy2000/epic-freebies-helper/discussions/3)"
              echo "- If the game was already in your library, Epic may not send a separate confirmation email. Review the logs and artifacts when verification is needed."
              echo "- If you later report an issue from a private fork, upload the artifact zip files because maintainers cannot access private Actions pages."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write failure summary
        if: failure()
        run: |
          if grep -Rqs -E \
            'unable to download any more free games|wait 24 hours before trying again|free-game redemption rate limit detected' \
            app/volumes/logs/ app/volumes/runtime/ 2>/dev/null; then
            {
              echo "## Claim not completed: Epic 24-hour limit"
              echo
              echo "本次领取未成功：Epic 已限制该账号继续领取免费游戏。"
              echo
              echo "Epic blocked additional free-game redemptions for the affected account. This run did not confirm a successful claim for that account."
              echo
              echo "Wait at least 24 hours before running the workflow again. Repeated retries during this period will not complete the claim."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Claim not completed"
              echo
              echo "本次领取未完成，不能视为领取成功。"
              echo
              echo "The workflow failed before all available games were confirmed in the library. Do not treat this run as a successful claim."
              echo
              echo "Review the failed step and uploaded runtime/log artifacts for the specific cause."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epic-runtime-${{ github.run_id }}
          path: |
            app/volumes/runtime/
            app/volumes/hcaptcha/.challenge/
          include-hidden-files: true
          retention-days: 7

      - name: Upload log artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epic-logs-${{ github.run_id }}
          path: app/volumes/logs/
          retention-days: 7

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epic-screenshots-${{ github.run_id }}
          path: app/volumes/screenshots/
          retention-days: 7
